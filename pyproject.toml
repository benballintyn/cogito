[project]
name = "cogito"
version = "0.1.2"
description = ""
authors = [
    {name = "benballintyn", email = "benballintyn@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "python-dotenv>=1.0.1,<2.0.0",
    "loguru>=0.7.2,<0.8.0",
    "optuna>=4.1.0,<5.0.0",
    "jsonlines>=4.0.0,<5.0.0",
    "httpx>=0.28.1,<0.29.0",
    "tiktoken>=0.8.0,<0.9.0",
    "pandas>=2.2.3,<3.0.0",
    "boto3>=1.36.12,<2.0.0",
    "pyarrow>=19.0.0,<20.0.0"
]

[tool.poetry]
packages = [{include = "cogito"}]

[tool.poetry.group.dev.dependencies]
ipython = "^8.23.0"
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
coverage = "^7.6.10"
codecov = "^2.1.13"
pytest-asyncio = "^0.25.2"
pytest-mock = "^3.14.0"
sphinx = "^8.1.3"
sphinx-autodoc-typehints = "^3.0.1"
sphinx-rtd-theme = "^3.0.2"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.0"
mkdocstrings = {extras = ["python"], version = "^0.30.1"}

[tool.pytest.ini_options]
addopts = "--cov=cogito --cov-report=xml --cov-report=term-missing"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
