[tool.poetry]
name = "cogito"
version = "0.1.2"
description = ""
authors = ["benballintyn <benballintyn@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
python-dotenv = "^1.0.1"
loguru = "^0.7.2"
optuna = "^4.1.0"
jsonlines = "^4.0.0"
httpx = "^0.28.1"
tiktoken = "^0.8.0"
pandas = "^2.2.3"
boto3 = "^1.36.12"

[tool.poetry.group.dev.dependencies]
ipython = "^8.23.0"
pytest = "^8.3.4"
pytest-cov = "^6.0.0"
coverage = "^7.6.10"
codecov = "^2.1.13"
pytest-asyncio = "^0.25.2"
pytest-mock = "^3.14.0"
sphinx = "^8.1.3"
sphinx-autodoc-typehints = "^3.0.1"
sphinx-rtd-theme = "^3.0.2"

[tool.pytest.ini_options]
addopts = "--cov=cogito --cov-report=xml --cov-report=term-missing"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
