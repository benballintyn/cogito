name: Test and Update Coverage Badge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Poetry dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 - --version 1.6.1
          export PATH="$HOME/.local/bin:$PATH"

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Run tests and calculate coverage
        id: coverage
        run: |
          set -e
          set -x
          mkdir -p .github/badges
          poetry run pytest --cov=cogito tests/ -v > coverage.txt
          COVERAGE=$(grep -Po '(?<=TOTAL\s+)\d+(?=%)' coverage.txt || echo 0)
          echo "Coverage is $COVERAGE%"
          COLOR="red"
          if [ $COVERAGE -ge 90 ]; then
            COLOR="green"
          elif [ $COVERAGE -ge 75 ]; then
            COLOR="yellow"
          fi
          echo "<svg xmlns='http://www.w3.org/2000/svg' width='98' height='20'>
            <rect width='49' height='20' fill='#555'/>
            <rect x='49' width='49' height='20' fill='$COLOR'/>
            <text x='24.5' y='14' font-size='11' fill='#fff' text-anchor='middle'>coverage</text>
            <text x='73.5' y='14' font-size='11' fill='#fff' text-anchor='middle'>$COVERAGE%</text>
          </svg>" > .github/badges/coverage-${{ matrix.python-version }}.svg
        env:
          CI: true

      - name: Commit coverage badge
        if: matrix.python-version == '3.11'
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add .github/badges/coverage-${{ matrix.python-version }}.svg
          git commit -m "Update coverage badge for Python ${{ matrix.python-version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
