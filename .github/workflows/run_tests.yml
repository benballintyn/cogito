name: Run Pytest

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: # Optional: Allows manual triggering from the GitHub UI

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch the full history to ensure branch checkout works
      
      - name: Ensure Correct Branch
        run: |
          git fetch origin ${{ github.head_ref }}:${{ github.head_ref }}
          git checkout ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root --with dev

      - name: Run Pytest
        run: |
          set -e
          set -x
          poetry run pytest --cov=cogito tests/ --cov-report=xml --cov-report=term > coverage.txt
        env:
          CI: true
      


  sync-dev:
    if: github.ref == 'refs/heads/main'  # Only run if the event is on the main branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full history for merging

      - name: Set up Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Sync dev with main
        run: |
          # Ensure main is up to date
          git checkout main
          git pull origin main
          
          # Merge main into dev
          git checkout dev
          git merge --ff-only main || echo "No changes to merge"
          
          # Push changes back to dev
          git push origin dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}